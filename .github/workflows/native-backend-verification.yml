name: StockPicks native backend verification

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - 'requirements-backend.txt'
      - '.github/workflows/native-backend-verification.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      STOCK_PICKS_DATA: ${{ runner.temp }}/stockpicks-validation
      DEBUG: 'false'
      COOKIE_SECRET: 'validation-only-not-for-public-deployment'
      ALLOWED_ORIGINS: 'http://127.0.0.1:5001'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-backend.txt
      - name: Install unmodified upstream backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-backend.txt pytest
      - name: Check Python modules compile
        run: python -m compileall -q backend
      - name: Run upstream selector and backend unit tests
        working-directory: backend
        run: python -m pytest tests/ -q --tb=short
      - name: Verify native selector import and scoring API
        working-directory: backend
        run: |
          python - <<'PY'
          from selector import StockSelector
          from selector.scorer import calculate_short_term_aggressive, calculate_short_term_conservative
          assert callable(calculate_short_term_aggressive)
          assert callable(calculate_short_term_conservative)
          selector = StockSelector()
          assert callable(selector.select_short_term_stocks)
          print("NATIVE_SELECTOR_API_OK")
          PY
      - name: Verify Tornado HTTP health endpoint without scheduler
        working-directory: backend
        run: |
          python - <<'PY'
          import json
          import threading
          import urllib.request
          from tornado.httpserver import HTTPServer
          from tornado.ioloop import IOLoop
          from main import Application
          port = 18751
          loop = IOLoop()
          ready = threading.Event()
          errors = []
          def server():
              try:
                  loop.make_current()
                  http_server = HTTPServer(Application())
                  http_server.listen(port, address="127.0.0.1")
                  ready.set()
                  loop.start()
                  http_server.stop()
              except Exception as exc:
                  errors.append(str(exc))
                  ready.set()
              finally:
                  loop.close()
          worker = threading.Thread(target=server, daemon=True)
          worker.start()
          assert ready.wait(10), "HTTP server did not start"
          assert not errors, errors
          try:
              with urllib.request.urlopen(f"http://127.0.0.1:{port}/api/health", timeout=6) as response:
                  payload = json.load(response)
              assert payload.get("status") == "ok", payload
              print("NATIVE_TORNADO_HEALTH_OK", payload.get("version"))
          finally:
              loop.add_callback(loop.stop)
              worker.join(timeout=5)
          PY
